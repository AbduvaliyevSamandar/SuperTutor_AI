name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - 'supertutor-api/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'supertutor-api/**'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supertutor-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: supertutor-api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
