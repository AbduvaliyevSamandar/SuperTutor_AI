name: supertutor_app
description: "SuperTutor AI — multilingual AI tutor with avatar chat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Auth + DB (Supabase)
  supabase_flutter: ^2.8.4

  # Avatar (Lottie animations)
  lottie: ^3.3.1

  # Voice
  record: ^6.0.0
  just_audio: ^0.9.42
  permission_handler: ^11.3.1
  path_provider: ^2.1.5

  # Image + markdown rendering
  image_picker: ^1.1.2
  flutter_markdown: ^0.7.5

  # Animations + branding
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  flutter_native_splash: ^2.4.4

  # Storage
  shared_preferences: ^2.3.3

  # Env
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#58CC02"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter_native_splash:
  color: "#58CC02"
  image: "assets/icon/icon_fg.png"
  android_12:
    color: "#58CC02"
    image: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
    - assets/lottie/
