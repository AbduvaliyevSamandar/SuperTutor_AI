# Render Blueprint — deploys backend + Flutter web from this repo.
# https://render.com/docs/blueprint-spec
#
# After connecting this repo to Render:
#   Dashboard -> New -> Blueprint -> pick this repo -> Apply.
# Then set the `sync: false` env vars from the Render dashboard.

services:
  # ----- Backend (FastAPI + Groq/OpenAI/Gemini cascade) -----
  - type: web
    name: supertutor-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: supertutor-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_STT_MODEL
        value: whisper-large-v3
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_STT_MODEL
        value: whisper-1
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  # ----- Frontend (Flutter Web static site) -----
  - type: web
    name: supertutor-web
    runtime: static
    plan: free
    rootDir: supertutor-app
    buildCommand: ./build_render.sh
    staticPublishPath: ./build/web
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: supertutor-api
          property: host
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
